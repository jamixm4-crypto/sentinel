# Cargo Deny configuration for Sentinel supply chain verification

[advisories]
version = 2
vulnerability = "deny"
unmaintained = "warn"
notice = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "Zlib",
]

[bans]
version = 2
multiple-versions = "warn"
wildcards = "allow"

[sources]
version = 2
unknown-registries = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
