id: "COR-WIN-0020"
name: "InterGuard Monitoring Agent"
version: 1
category: "OrganizationManaged"
severity: "Info"
base_confidence: 0.90
removal_policy: "DoNotRemove"
platforms:
  - "windows"
  - "macos"
vendor: "Awareness Technologies"
description: "Endpoint tracking and DLP monitoring recording user sessions, keystrokes, and program usage."
is_legitimate_use_likely: true

detection:
  processes:
    - name: "itagent.exe"
    - name: "dgagent.exe"
    - name: "sbam.exe"
  services:
    - name: "itagent"
  paths:
    - "C:\\ProgramData\\Awareness Technologies\\"

removal:
  manual_steps_windows: |
    Enterprise endpoint agent. Contact IT administration.
