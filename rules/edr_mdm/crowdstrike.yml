id: "EDR-ALL-0001"
name: "CrowdStrike Falcon Sensor"
version: 1
category: "OrganizationManaged"
severity: "Info"
base_confidence: 0.98
removal_policy: "DoNotRemove"
platforms:
  - "windows"
  - "macos"
  - "linux"
vendor: "CrowdStrike Inc."
description: "Enterprise endpoint detection and response (EDR) platform managed by your company's security operations team."
is_legitimate_use_likely: true
safety_warning: "This is a legitimate enterprise cybersecurity sensor deployed by your organization. Do not attempt to disable or remove it."

detection:
  processes:
    - name: "CSFalconService.exe"
    - name: "falcon-sensor"
    - name: "falcond"
  services:
    - name: "CSFalconService"
    - name: "CSAgent"
  paths:
    - "C:\\Program Files\\CrowdStrike\\"
    - "/Applications/Falcon.app"
  registry_keys:
    - hive: "HKLM"
      path: "SOFTWARE\\CrowdStrike"

removal:
  manual_steps_windows: |
    Enterprise software. Removing CrowdStrike Falcon requires a maintenance token generated by your company's Falcon administrator.
