id: "MDM-MAC-0010"
name: "Kandji Apple Device Management"
version: 1
category: "OrganizationManaged"
severity: "Info"
base_confidence: 0.95
removal_policy: "DoNotRemove"
platforms:
  - "macos"
vendor: "Kandji Inc."
description: "Apple MDM and endpoint security suite."
is_legitimate_use_likely: true

detection:
  processes:
    - name: "kandji-agent"
