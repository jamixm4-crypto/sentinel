id: "LEG-ALL-0035"
name: "Password Manager (1Password / Bitwarden / KeePass)"
version: 1
category: "KeyboardCapture"
severity: "Info"
base_confidence: 0.95
removal_policy: "ManualReview"
platforms:
  - "windows"
  - "macos"
  - "linux"
vendor: "Password Security Vendors"
description: "Legitimate password managers that register global hotkeys or accessibility hooks to autofill credentials."
is_legitimate_use_likely: true

detection:
  processes:
    - name: "1Password.exe"
    - name: "Bitwarden.exe"
    - name: "KeePass.exe"
    - name: "keepassxc.exe"
    - name: "1Password"
    - name: "Bitwarden"
    - name: "keepassxc"
