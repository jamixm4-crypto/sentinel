id: "STK-WIN-0046"
name: "SoftActivity TS Monitor & Activity Monitor"
version: 1
category: "ScreenCapture"
severity: "High"
base_confidence: 0.92
removal_policy: "SafeAuto"
platforms:
  - "windows"
vendor: "SoftActivity (Deep Software Inc.)"
description: "Invasive surveillance suite recording real-time keystrokes, emails, webcam snapshots, and continuous desktop video."
is_legitimate_use_likely: false

detection:
  processes:
    - name: "tsmon.exe"
    - name: "tsmonsvc.exe"
    - name: "actmon.exe"
    - name: "samon.exe"
  registry_keys:
    - hive: "HKLM"
      path: "SOFTWARE\\SoftActivity"
    - hive: "HKLM"
      path: "SYSTEM\\CurrentControlSet\\Services\\tsmonsvc"
  services:
    - name: "tsmonsvc"
    - name: "SoftActivity Monitor Service"
  paths:
    - "C:\\Program Files\\SoftActivity\\"
    - "C:\\Windows\\System32\\tsmon\\"
  network_domains:
    - "softactivity.com"

removal:
  services_to_stop:
    - "tsmonsvc"
  services_to_delete:
    - "tsmonsvc"
  processes_to_kill:
    - "tsmon.exe"
    - "tsmonsvc.exe"
    - "actmon.exe"
  paths_to_remove:
    - "C:\\Program Files\\SoftActivity"
    - "C:\\Windows\\System32\\tsmon"
  manual_steps_windows: |
    1. Stop tsmonsvc service: `net stop tsmonsvc`.
    2. Remove service: `sc.exe delete tsmonsvc`.
    3. Delete files in C:\Program Files\SoftActivity.

references:
  - "https://attack.mitre.org/techniques/T1113/"
  - "https://attack.mitre.org/techniques/T1056/001/"
