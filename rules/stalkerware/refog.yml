id: "STK-WIN-0020"
name: "Refog Personal Monitor / Employee Monitor"
version: 1
category: "KeyboardCapture"
severity: "High"
base_confidence: 0.85
removal_policy: "SafeAuto"
platforms:
  - "windows"
  - "macos"
vendor: "Refog Inc."
description: "Desktop monitoring tool recording keystrokes, clipboard, screenshots, and active windows."
is_legitimate_use_likely: false

detection:
  processes:
    - name: "mkb.exe"
    - name: "rfgsvc.exe"
    - name: "mpk.exe"
  registry_keys:
    - hive: "HKLM"
      path: "SOFTWARE\\Refog"
    - hive: "HKCU"
      path: "Software\\Refog"
  services:
    - name: "rfgsvc"
    - name: "Refog Monitor"
  paths:
    - "C:\\Program Files\\Refog\\"
    - "C:\\ProgramData\\Refog\\"

removal:
  uninstall_key: "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Refog*"
  services_to_stop:
    - "rfgsvc"
  services_to_delete:
    - "rfgsvc"
  processes_to_kill:
    - "mkb.exe"
    - "rfgsvc.exe"
    - "mpk.exe"
  paths_to_remove:
    - "C:\\Program Files\\Refog"
    - "C:\\ProgramData\\Refog"
  manual_steps_windows: |
    1. Terminate mpk.exe and rfgsvc.exe.
    2. Stop service rfgsvc via `sc stop rfgsvc`.
    3. Delete directory C:\Program Files\Refog.
