id: "STK-ALL-0050"
name: "iKeyMonitor Keylogger & Spy App"
version: 1
category: "KeyboardCapture"
severity: "Critical"
base_confidence: 0.90
removal_policy: "SafeAuto"
platforms:
  - "windows"
  - "macos"
vendor: "Awosoft / iKeyMonitor"
description: "Covert keylogger and monitoring app tracking keystrokes, clipboard, screenshots, and visited websites."
is_legitimate_use_likely: false

detection:
  processes:
    - name: "ikm.exe"
    - name: "ikeymonitor.exe"
    - name: "ikmsvc.exe"
  services:
    - name: "ikmsvc"
  paths:
    - "C:\\Program Files\\iKeyMonitor\\"
    - "C:\\Program Files (x86)\\iKeyMonitor\\"
    - "/Applications/iKeyMonitor.app"
  network_domains:
    - "ikeymonitor.com"

removal:
  services_to_stop:
    - "ikmsvc"
  services_to_delete:
    - "ikmsvc"
  processes_to_kill:
    - "ikm.exe"
    - "ikmsvc.exe"
  paths_to_remove:
    - "C:\\Program Files\\iKeyMonitor"
    - "C:\\Program Files (x86)\\iKeyMonitor"
