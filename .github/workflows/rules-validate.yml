name: Validate Rules

on:
  pull_request:
    paths:
      - "rules/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Validate All YAML Rules
        run: cargo test -p sentinel-rules --test schema_tests
