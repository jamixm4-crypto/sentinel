name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            bin_name: sentinel.exe
            archive: sentinel-x86_64-pc-windows-msvc.zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            bin_name: sentinel
            archive: sentinel-x86_64-unknown-linux-gnu.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            bin_name: sentinel
            archive: sentinel-x86_64-apple-darwin.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            bin_name: sentinel
            archive: sentinel-aarch64-apple-darwin.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }} --bin sentinel

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/sentinel.exe, README.md, LICENSE-APACHE, LICENSE-CC-BY -DestinationPath ${{ matrix.archive }}

      - name: Package Unix
        if: matrix.os != 'windows-latest'
        run: |
          tar -czvf ${{ matrix.archive }} -C target/${{ matrix.target }}/release sentinel -C ../../../ README.md LICENSE-APACHE LICENSE-CC-BY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Generate Checksums
        run: |
          sha256sum sentinel-*/* > SHA256SUMS

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sentinel-*/*
            SHA256SUMS
          draft: false
          prerelease: false
          generate_release_notes: true
