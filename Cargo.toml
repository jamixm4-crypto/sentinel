[workspace]
members = [
    "crates/core",
    "crates/collectors",
    "crates/rules",
    "crates/scoring",
    "crates/removal",
    "crates/report",
    "crates/cli",
]
resolver = "2"

[workspace.package]
version = "0.1.4"
edition = "2021"
authors = ["Sentinel Contributors"]
license = "Apache-2.0"
repository = "https://github.com/jamixm4-crypto/sentinel"
homepage = "https://github.com/jamixm4-crypto/sentinel"
documentation = "https://github.com/jamixm4-crypto/sentinel#readme"
readme = "README.md"
keywords = ["security", "spyware", "stalkerware", "detector", "privacy"]
categories = ["command-line-utilities", "os"]

[workspace.dependencies]
# Internal crates
sentinel-core = { path = "crates/core" }
sentinel-collectors = { path = "crates/collectors" }
sentinel-rules = { path = "crates/rules" }
sentinel-scoring = { path = "crates/scoring" }
sentinel-removal = { path = "crates/removal" }
sentinel-report = { path = "crates/report" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

# System and Process
sysinfo = "0.31"
walkdir = "2.5"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

# CLI and Output
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
indicatif = "0.17"

# Logging and Utils
tracing = "0.1"
tracing-subscriber = "0.3"
thiserror = "1.0"
regex = "1.10"
sha2 = "0.10"
hex = "0.4"
